# Alembic configuration for SchemeSetu

[alembic]
script_location = alembic
sqlalchemy.url = postgresql://localhost/schemesetu

# Use generic setup
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
revision_environment = false
sourceless = false
# version_locations is omitted: alembic splits it on whitespace, which breaks
# checkouts whose absolute path contains a space (e.g. "7TH SEM"). The default
# <script_location>/versions directory is used instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

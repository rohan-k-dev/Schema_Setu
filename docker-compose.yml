# SchemeSetu — full local stack
#
#   docker compose up --build
#
# Services:
#   postgres  PostgreSQL 16 (canonical system of record)
#   init      one-shot: alembic migrations → canonical corpus import → integrity check
#   backend   FastAPI API on http://localhost:8000
#   frontend  Next.js UI on http://localhost:3000
#
# API keys (GROQ/TAVILY/SARVAM) and REVIEW_API_KEY are read from backend/.env if it
# exists (copy backend/.env.example). Without keys the app starts and reports which
# services are unavailable (GET /health/ready).
# Default database credentials below are for LOCAL use only — change them anywhere else.

x-backend-env: &backend-env
  DATABASE_URL: postgresql://schemesetu:schemesetu@postgres:5432/schemesetu
  CORS_ORIGINS: '["http://localhost:3000"]'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: schemesetu
      POSTGRES_USER: schemesetu
      POSTGRES_PASSWORD: schemesetu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemesetu -d schemesetu"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-env
    command: >
      sh -c "alembic upgrade head &&
             python ../scripts/import_corpus.py &&
             python ../scripts/db_check.py"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
